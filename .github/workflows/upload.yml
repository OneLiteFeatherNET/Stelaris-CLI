name: Generate and Upload Dart Project

on:
  push:
    tags:
      - 'v*'

jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    env:
      ONELITEFEATHER_MAVEN_USERNAME: ${{ secrets.ONELITEFEATHER_MAVEN_USERNAME }}
      ONELITEFEATHER_MAVEN_PASSWORD: ${{ secrets.ONELITEFEATHER_MAVEN_PASSWORD }}
    steps:
      - name: Checkout stelaris-cli repository
        uses: actions/checkout@v6
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Strip leading v from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build JAR gradle project
        run: ./gradlew clean build

      - name: Run Stelaris CLI
        env:
          stelaris.cli.username: 'stelaris-bot'
          stelaris.cli.password: ${{ secrets.DART_REPO_TOKEN }}
          stelaris.cli.cloneUrl: https://github.com/${{ secrets.TARGET_REPOSITORY }}.git
        run: java -jar build/libs/stelaris-cli.jar -version ${{ env.VERSION }} -type git -experimental
      
