name: Release

# release-please collects Conventional Commits into a release PR; merging it
# tags the version and cuts the GitHub release. Everything that has to happen
# for a release is chained into this same run on purpose: release-please tags
# with GITHUB_TOKEN, and a tag pushed that way does NOT start a separate
# `on: push: tags` workflow.
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: OneLiteFeatherNET/workflows/.github/workflows/release-please.yml@v2.8.1
    secrets: inherit

  publish:
    name: Generate and push the Dart project
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      ONELITEFEATHER_MAVEN_USERNAME: ${{ secrets.ONELITEFEATHER_MAVEN_USERNAME }}
      ONELITEFEATHER_MAVEN_PASSWORD: ${{ secrets.ONELITEFEATHER_MAVEN_PASSWORD }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Build JAR gradle project
        run: ./gradlew clean build

      # Same invocation the tag-triggered upload workflow ran; the version comes
      # from release-please instead of from stripping the "v" off the tag name.
      - name: Run Stelaris CLI
        env:
          stelaris.cli.username: 'stelaris-bot'
          stelaris.cli.password: ${{ secrets.DART_REPO_TOKEN }}
          stelaris.cli.cloneUrl: https://github.com/${{ secrets.TARGET_REPOSITORY }}.git
        run: java -jar build/libs/stelaris-cli.jar -version ${{ needs.release-please.outputs.version }} -type git -experimental
  sbom:
    name: Attach SBOM to release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: bom.json
          # An SBOM is an inventory, not a finding list - never fail on it.
          exit-code: '0'

      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" bom.json --clobber
