name: PR Lint

# Conventional Commits on the PR title and every commit on the branch.
# Keeps the history readable and greppable by change type, and keeps the door
# open for generating a changelog from it later.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    uses: OneLiteFeatherNET/workflows/.github/workflows/pr-lint.yml@v2.8.2
    secrets: inherit
